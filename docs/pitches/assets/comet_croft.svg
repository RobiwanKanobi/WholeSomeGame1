<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 706" role="img" aria-labelledby="title desc">
  <title>Comet Croft</title>
  <desc>Steam capsule concept art with bright comet diagonal and floating farmhouse island</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6783d6" />
      <stop offset="100%" stop-color="#1f3760" />
    </linearGradient>
    <radialGradient id="bloom" cx="72%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#ffe59a" stop-opacity="0.56" />
      <stop offset="100%" stop-color="#ffe59a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162232" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b121d" stop-opacity="0.78" />
    </linearGradient>
    <radialGradient id="fog" cx="52%" cy="58%" r="78%">
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0.38" />
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04101b" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>
  <rect width="1232" height="706" rx="32" fill="url(#bg)" />
  <rect x="16" y="16" width="1200" height="674" rx="28" fill="none" stroke="rgba(255,255,255,0.24)" />
  <rect width="1232" height="706" fill="url(#bloom)" />


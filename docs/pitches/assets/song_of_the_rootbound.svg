<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1232 706" role="img" aria-labelledby="title desc">
  <title>Song of the Rootbound</title>
  <desc>Steam capsule concept art with giant lute silhouette and glowing musical roots</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#183052" />
      <stop offset="100%" stop-color="#2c5a46" />
    </linearGradient>
    <radialGradient id="bloom" cx="72%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#9ef6c6" stop-opacity="0.56" />
      <stop offset="100%" stop-color="#9ef6c6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#162232" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0b121d" stop-opacity="0.78" />
    </linearGradient>
    <radialGradient id="fog" cx="52%" cy="58%" r="78%">
      <stop offset="56%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#05070a" stop-opacity="0.38" />
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#04101b" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

  </defs>

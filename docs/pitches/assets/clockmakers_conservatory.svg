  <title>Clockmaker&#x27;s Conservatory</title>
  <desc>Steam capsule concept art with giant brass clock flower and greenhouse silhouettes</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90c39e" />
      <stop offset="100%" stop-color="#314d54" />
    </linearGradient>
    <radialGradient id="bloom" cx="72%" cy="42%" r="52%">
      <stop offset="0%" stop-color="#ffd486" stop-opacity="0.56" />
      <stop offset="100%" stop-color="#ffd486" stop-opacity="0" />
